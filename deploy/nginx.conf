# Fly.io terminates TLS and forwards plain HTTP to :8080 (fly.toml's
# internal_port). Everything here is static.

# www.<domain> -> <domain>, so search engines see one site rather than two
server {
    listen 8080;
    server_name ~^www\.(?<domain>.+)$;
    return 301 https://$domain$request_uri;
}

server {
    # IPv4 only: Fly's proxy reaches the app on 0.0.0.0, and an IPv6 listen
    # stops nginx starting at all on hosts without IPv6
    listen 8080 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Redirects say "/l81", not "http://<host>:8080/l81": nginx only sees
    # Fly's internal port and plain HTTP, neither of which the visitor uses
    absolute_redirect off;

    # the page is ~330 KB, mostly the embedded background photo
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript image/svg+xml;

    # Every file here can change with a deploy and they are all small, so
    # browsers revalidate each visit (a 304 when nothing changed) rather than
    # holding a stale calculator for days.
    add_header Cache-Control             "no-cache" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # fly.toml's health check
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # browsers and crawlers ask for /favicon.ico whatever the page links
    location = /favicon.ico { try_files /img/favicon.ico =404; }

    location = /privacy {
        return 301 /privacy.html;
    }

    # the tool pages are the same file; its script reads the address
    location = /l81  { try_files /index.html =404; }
    location = /sph2 { try_files /index.html =404; }
    location ~ ^/(l81|sph2)/$ { return 301 /$1; }

    location / {
        try_files $uri $uri/ =404;
    }
}
