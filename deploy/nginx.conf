# Fly.io terminates TLS and forwards plain HTTP to :8080 (fly.toml's
# internal_port). Everything here is static.
server {
    # IPv4 only: Fly's proxy reaches the app on 0.0.0.0, and an IPv6 listen
    # stops nginx starting at all on hosts without IPv6
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # the page is ~330 KB, mostly the embedded background photo
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript image/svg+xml;

    # Every file here can change with a deploy and they are all small, so
    # browsers revalidate each visit (a 304 when nothing changed) rather than
    # holding a stale calculator for days.
    add_header Cache-Control             "no-cache" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # fly.toml's health check
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /privacy {
        return 301 /privacy.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
