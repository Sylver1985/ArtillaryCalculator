# Fly.io app config for Wardogs FireGrid (wardogsfiregrid.com). See DEPLOY.md.
#
# `app` is unique across all of Fly.io and gives the <app>.fly.dev address.
# If it's ever taken, change it here and in DEPLOY.md's commands.
app = "wardogs-firegrid"

# Ashburn, Virginia: beside LobbyForge, and Fly's cheapest region. A static
# page loads fast from anywhere, so one region is plenty; `fly platform
# regions` lists the others.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true

  # Stop the machine when nobody is using it and start it on the next visit
  # (about a second's delay for that first visitor). Set min_machines_running
  # to 1 to keep one always warm, for a little more a month.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # nginx serves a static page easily, so one machine takes all the normal
  # traffic; the spare that `fly deploy` makes only starts in a real rush
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
