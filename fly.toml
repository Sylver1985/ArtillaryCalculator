# Fly.io app config for Wardogs FireGrid (wardogsfiregrid.com). See DEPLOY.md.
#
# `app` is unique across all of Fly.io and gives the <app>.fly.dev address.
# If it's ever taken, change it here and in DEPLOY.md's commands.
app = "wardogs-firegrid"

# Ashburn, Virginia: beside LobbyForge, and Fly's cheapest region. A static
# page loads fast from anywhere, so one region is plenty; `fly platform
# regions` lists the others.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true

  # One machine always stays running, so nobody waits for a boot, search
  # engine crawlers included: from a cold stop the site took about 4.5 s to
  # answer. The spare that `fly deploy` makes still stops when idle. Set
  # min_machines_running to 0 to let the last machine sleep too, which saves
  # its running cost but brings the boot delay back.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # nginx serves a static page easily, so one machine takes all the normal
  # traffic; the spare that `fly deploy` makes only starts in a real rush
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
